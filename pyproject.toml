[project]
name = "revisenlearn"
version = "0.1.0"
description = "Revise & Learn — local-first study app"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pywebview>=5.3",
    "keyring>=25.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Phase 4+. Kept out of the default install so Phase 1 does not pull a ~130MB
# ONNX model download. See DECISIONS.md.
embeddings = ["fastembed>=0.4"]
# Phase 5+.
llm = ["google-genai>=2.0.0"]
# Phase 7+.
fsrs = ["fsrs>=5.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "playwright>=1.48",
]

[project.scripts]
revisenlearn = "revisenlearn.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revisenlearn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
markers = [
    "ui: end-to-end tests that drive a real browser via Playwright",
]
