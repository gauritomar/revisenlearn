[project]
name = "revisenlearn"
version = "0.1.0"
description = "Revise & Learn — local-first study app"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pywebview>=5.3",
    "keyring>=25.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    # Phase 4. Local ONNX embeddings, no PyTorch (spec §2). Concept identity and
    # semantic search must work offline (spec §16), so this is not optional.
    "fastembed>=0.4",
    "numpy>=1.26",
    # Phase 7. Spec §2 names "py-fsrs"; the distribution is published as
    # `fsrs`. Do not reimplement FSRS.
    "fsrs>=5.0",
    # Phase 5+. Not optional: without it "Process notes" cannot call anything
    # and prose revision has no questions (spec §16). It was an extra, and
    # `uv sync` does not install extras, so a real run failed with
    # "cannot import name 'genai' from 'google'".
    "google-genai>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "playwright>=1.48",
]

[project.scripts]
revisenlearn = "revisenlearn.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revisenlearn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
markers = [
    "ui: end-to-end tests that drive a real browser via Playwright",
]
